<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Informações</title>
</head>
<style>
        body {
            font-family: Arial, sans-serif;

            width: 500px;

        h2 {

        }

        p {
            color: #666;

            line-height: 1.5;
        }

            text-align: left;

    <p>
        Esse é o projeto de uma Rede Social desenvolvido em HTML, CSS e PHP.

        Aqui é possível cadastrar usuários, criar postagens e fazer comentários.
    </p>

    <h3>Funcionalidades</h3>

    <ul>
        <li>Cadastrar usuários</li>

</html>
